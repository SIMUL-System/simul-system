spring.application.name=backend

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

simul.mail.remetente=${SMTP_FROM}

simul.time-zone=${SIMUL_TIME_ZONE:America/Sao_Paulo}

simul.notificacao.scheduler.enabled=${NOTIFICACAO_SCHEDULER_ENABLED:false}
simul.notificacao.scheduler.cron=${NOTIFICACAO_SCHEDULER_CRON:0 * * * * *}

simul.cors.allowed-origins=${SIMUL_CORS_ALLOWED_ORIGINS:http://localhost:5173}

simul.webpush.vapid.public-key=${WEB_PUSH_VAPID_PUBLIC_KEY:}
simul.webpush.vapid.private-key=${WEB_PUSH_VAPID_PRIVATE_KEY:}
simul.webpush.vapid.subject=${WEB_PUSH_VAPID_SUBJECT:}

simul.email-verification.expiration-hours=${EMAIL_VERIFICATION_EXPIRATION_HOURS:24}

simul.password-recovery.expiration-minutes=${PASSWORD_RECOVERY_EXPIRATION_MINUTES:60}

simul.frontend.url=${SIMUL_FRONTEND_URL:http://localhost:5173}