<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SIMUL: consulte os dias e horários da coleta seletiva do seu bairro e receba lembretes por e-mail."
    />
    <meta name="theme-color" content="#0b5cad" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap"
    />

    <title>SIMUL — Coleta seletiva</title>

    <!-- Aplica o tema antes da primeira pintura para não piscar. -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('simul-tema')
          var tema =
            salvo === 'light' || salvo === 'dark'
              ? salvo
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = tema
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
